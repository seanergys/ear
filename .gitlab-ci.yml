workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:          # List of stages for jobs, and their order of execution
  - quality
  - build
  - test
  - deploy

image: registry.gitlab.bsc.es/ear_team/ear-ci:v6

debugs_disabled:
  stage: quality
  script:
    - if grep -rIE -e "^[[:blank:]]*#define[[:blank:]]+SHOW_DEBUGS" -e "^[[:blank:]]*#define[[:blank:]]+DEBUG_ENABLED[[:blank:]]+1" src; then false; else true; fi

clang-format:
  stage: quality
  script:
    - dnf install -y clang-tools-extra-19.1.7-2.module+el8.10.0+1965+112b558b
    - find src/ -name "*.[ch]" -exec clang-format --Werror --fail-on-incomplete-format --dry-run {} +

compile-no-mpi-loader:
  stage: build
  script:
    # This script compiles, installs, and test the correctness of the installation
    - $TESTDIR/build/compile_no_mpi_loader.sh
  artifacts:
    untracked: false
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-no-mpi-loader"

compile-no-mpi:
  stage: build
  script:
    - export CONFIG_SITE="$TESTDIR/config-sites/config.no-mpi.site"
    - MAKE_FEATURES="MPI_CFLAGS='$(pkgconf ompi-c --cflags)'" $TESTDIR/compile.sh

compile-mpi:
  stage: build
  script:
    # This script compiles, installs, and test the correctness of the installation
    - $TESTDIR/build/compile_ompi.sh
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-ompi"

compile-mpi-mysql:
  stage: build
  script:
    - export CONFIG_SITE="$TESTDIR/config-sites/config.ompi.site"
    - MAKE_FEATURES="MPI_CFLAGS='$(pkgconf ompi-c --cflags)'" CONFIGURE_FLAGS="--prefix=$PWD/ear-db" $TESTDIR/compile.sh
    - make install
    - make etc.install
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-db"

test-install-db:
  stage: test
  needs: [compile-mpi-mysql]
  variables:
    MARIADB_ROOT_PASSWORD: my-secret-pw
  services:
    - name: mariadb:latest
      alias: mariadb
  script:
    - echo "Checking DB installation"
    - $TESTDIR/test_install.sh ear-db
    - $TESTDIR/test_install_db.sh ear-db
    - $TESTDIR/test_install_etc.sh ear-db
    - cp ear-db/etc/ear/ear.conf.full.template ear-db/etc/ear/ear.conf
    - $TESTDIR/scripts/create_db.sh ear-db ear-db/etc/ear/ear.conf
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-db"

deploy-eardbd:
  stage: deploy
  needs: [test-install-db]
  variables:
    MARIADB_ROOT_PASSWORD: my-secret-pw
  services:
    - name: mariadb:latest
      alias: mariadb
  script:
    - $TESTDIR/scripts/create_db.sh ear-db ear-db/etc/ear/ear.conf
    - ls -ltr ear-db/sbin/
    - $TESTDIR/scripts/deploy_eardbd.sh ear-db ear-db/etc
  artifacts:
    when: always
    paths:
      - eardbd.out
      - ear-db/etc/ear/ear.conf

deploy-eard:
  stage: deploy
  needs: [test-install-db]
  script:
    - $TESTDIR/scripts/deploy_eard.sh ear-db ear-db/etc
  after_script:
    - mkdir ear_tmp
    - test -f /tmp/eard_journal.log && cp /tmp/eard_journal.log . || true
    - test -f /tmp/ear-dyn.conf && cp /tmp/ear-dyn.conf . || true
    - test -d /var/ear && cp -r /var/ear ear_tmp || true
  artifacts:
    name: eard_logs
    when: always
    paths:
      - eard.out # The stdout/stderr of the eard, generated by the deploy_eard.sh script.
      - eard_journal.log
      - ear-dyn.conf
      - ear_tmp

test-earl-mpi-lite:
  stage: test
  needs: [compile-mpi]
  timeout: 30 minutes
  script:
    - export PATH=$(pkgconf --variable=exec_prefix ompi-f90)/bin:$PATH
    - $TESTDIR/scripts/compile_nas.sh $TESTDIR/apps/NPB3.4.3/NPB3.4-MPI bt B
    - export EAR_ETC=ear-ompi/etc ; export EAR_INSTALL_PATH=ear-ompi ; export EAR_TMP=/tmp
    - OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 mpirun --oversubscribe -np 4 ear-ompi/bin/erun --ear=on --ear-verbose=1 --program="$TESTDIR/apps/NPB3.4.3/NPB3.4-MPI/bin/bt.B.x" 2> >(tee earl.out)
  artifacts:
    when: always
    name: earl-mpi_out
    paths:
      - earl.out

test-earl-omp-lite:
  stage: test
  needs: [compile-no-mpi-loader]
  timeout: 10 minutes
  script:
    - $TESTDIR/scripts/compile_nas.sh $TESTDIR/apps/NPB3.4.3/NPB3.4-OMP bt B
    - export EAR_ETC=ear-no-mpi-loader/etc ; export EAR_INSTALL_PATH=ear-no-mpi-loader ; export EAR_TMP=/tmp ; export OMP_NUM_THREADS=2
    - ear-no-mpi-loader/bin/erun --ear=on --ear-verbose=1 --program="$TESTDIR/apps/NPB3.4.3/NPB3.4-OMP/bin/bt.B.x" 2> >(tee earl.out)
  artifacts:
    when: always
    name: earl-omp_out
    paths:
      - earl.out

test-earl-mkl-lite:
  stage: test
  needs: [compile-no-mpi-loader]
  timeout: 30 minutes
  script:
    # Install oneMKL and Intel compilers
    - |
      tee > /tmp/oneAPI.repo << EOF
      [oneAPI]
      name=Intel® oneAPI repository
      baseurl=https://yum.repos.intel.com/oneapi
      enabled=1
      gpgcheck=1
      repo_gpgcheck=1
      gpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      EOF
    - mv /tmp/oneAPI.repo /etc/yum.repos.d
    - dnf install -y intel-oneapi-compiler-dpcpp-cpp
    - dnf install -y intel-oneapi-mkl-devel
    - source /opt/intel/oneapi/setvars.sh
    - $TESTDIR/scripts/compile_matrix_mul_mkl.sh $TESTDIR/apps/matrix_mul_mkl
    - export EAR_ETC=ear-no-mpi-loader/etc
    - export EAR_INSTALL_PATH=ear-no-mpi-loader
    - export EAR_TMP=/tmp
    - ear-no-mpi-loader/bin/erun --ear=on --ear-verbose=1 --program="$TESTDIR/apps/matrix_mul_mkl/matrix_mul_mkl double" 2> >(tee earl.out)
  artifacts:
    when: always
    name: earl-mkl_out
    paths:
      - earl.out
