workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
variables:
  CI_DEBUG_SERVICES: "true"

# Currently there is just on stage: build. Different jobs compile different versions of EAR by using
# compile.sh script provided in the ear_ci repository: https://gitlab.bsc.es/ear_team/ear-ci
stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

image: registry.gitlab.bsc.es/ear_team/ear-ci

compile-no-mpi-loader:
  stage: build
  script:
    - $TESTDIR/compile_no_mpi_loader.sh
  artifacts:
    untracked: false
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-no-mpi-loader"

compile-no-mpi:
  stage: build
  script:
    - export CONFIG_SITE="$TESTDIR/config-sites/config.no-mpi.site"
    - MAKE_FEATURES="MPI_CFLAGS='$(pkgconf ompi-c --cflags)'" $TESTDIR/compile.sh

compile-mpi:
  stage: build
  script:
    - export CONFIG_SITE="$TESTDIR/config-sites/config.ompi.site"
    - MAKE_FEATURES="MPI_CFLAGS='$(pkgconf ompi-c --cflags)'" CONFIGURE_FLAGS="--prefix=$PWD/ear-ompi" $TESTDIR/compile.sh
    - make install
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-ompi"

compile-mpi-mysql:
  stage: build
  script:
    - export CONFIG_SITE="$TESTDIR/config-sites/config.ompi.site"
    - MAKE_FEATURES="MPI_CFLAGS='$(pkgconf ompi-c --cflags)'" CONFIGURE_FLAGS="--prefix=$PWD/ear-db" $TESTDIR/compile.sh
    - make install
    - make etc.install
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-db"

test-install-mpi:
  stage: test
  needs: [compile-mpi]
  script:
    - echo "Checking installation for OpenMPI installation"
    - $TESTDIR/test_install.sh ear-ompi
    - $TESTDIR/test_install_ompi.sh ear-ompi

test-install-db:
  stage: test
  needs: [compile-mpi-mysql]
  variables:
    MARIADB_ROOT_PASSWORD: my-secret-pw
  services:
    - name: mariadb:latest
      alias: mariadb
  script:
    - echo "Checking DB installation"
    - $TESTDIR/test_install.sh ear-db
    - $TESTDIR/test_install_db.sh ear-db
    - $TESTDIR/test_install_etc.sh ear-db
    - cp ear-db/etc/ear/ear.conf.full.template ear-db/etc/ear/ear.conf
    - $TESTDIR/scripts/create_db.sh ear-db ear-db/etc/ear/ear.conf
  artifacts:
    when: on_success
    expire_in: 1 days
    paths:
      - "ear-db"

deploy-eardbd:
  stage: deploy
  needs: [test-install-db]
  variables:
    MARIADB_ROOT_PASSWORD: my-secret-pw
  services:
    - name: mariadb:latest
      alias: mariadb
  script:
    - $TESTDIR/scripts/create_db.sh ear-db ear-db/etc/ear/ear.conf
    - $TESTDIR/scripts/deploy_eardbd.sh ear-db ear-db/etc
  artifacts:
    when: always
    paths:
      - eardbd.out

deploy-eard:
  stage: deploy
  needs: [test-install-db]
  script:
    - $TESTDIR/scripts/deploy_eard.sh ear-db ear-db/etc
  after_script:
    - mkdir ear_tmp
    - test -f /tmp/eard_journal.log && cp /tmp/eard_journal.log . || true
    - test -f /tmp/ear-dyn.conf && cp /tmp/ear-dyn.conf . || true
    - test -d /var/ear && cp -r /var/ear ear_tmp || true
  artifacts:
    name: eard_logs
    when: always
    paths:
      - eard.out # The stdout/stderr of the eard, generated by the deploy_eard.sh script.
      - eard_journal.log
      - ear-dyn.conf
      - ear_tmp
  allow_failure: true

test-earl-lite:
  stage: test
  needs: [compile-mpi, test-install-mpi]
  script:
    - export PATH=$(pkgconf --variable=exec_prefix ompi-f90)/bin:$PATH
    - $TESTDIR/scripts/compile_nas.sh $TESTDIR/apps/NPB3.4.3/NPB3.4-MPI bt B
    - export EAR_ETC=ear-ompi/etc ; export EAR_INSTALL_PATH=ear-ompi ; export EAR_TMP=/tmp
    - OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 mpirun --oversubscribe -np 4 ear-ompi/bin/erun --ear=on --ear-verbose=1 --program="$TESTDIR/apps/NPB3.4.3/NPB3.4-MPI/bin/bt.B.x" 2> >(tee earl.out)
  artifacts:
    when: always
    name: earl_out
    paths:
      - earl.out
  allow_failure: true
